site_name: AIFlow
site_url: https://dotflow-io.github.io/aiflow/
site_author: Fernando Celmer

copyright: Fernando Celmer
repo_name: dotflow-io/aiflow
repo_url: https://github.com/dotflow-io/aiflow

theme:
  name: material
  palette:
    - media: (prefers-color-scheme)
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: black
      toggle:
        icon: material/lightbulb-outline
        name: Switch to system preference
  features:
  - content.tooltips
  - navigation.footer
  - navigation.tabs
  - navigation.tabs.sticky
  - navigation.top
  - navigation.path
  - navigation.indexes
  - search.share
  - search.suggest

extra_css:
  - assets/style.css

extra:
  python_supported_version: '3.10'

markdown_extensions:
  abbr: null
  attr_list: null
  footnotes: null
  md_in_html: null
  tables: null
  toc:
    permalink: true
  pymdownx.betterem: null
  pymdownx.caret: null
  pymdownx.highlight:
    line_spans: __span
  pymdownx.inlinehilite: null
  pymdownx.keys: null
  pymdownx.mark: null
  pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format ''
  pymdownx.tilde: null
  pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
  pymdownx.blocks.admonition:
    types:
    - note
    - attention
    - caution
    - danger
    - error
    - tip
    - hint
    - warning
    - info
    - check
  pymdownx.blocks.details: null
  pymdownx.blocks.tab:
    alternate_style: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            backlinks: tree
            heading_level: 2
            show_root_heading: true
            show_if_no_docstring: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true

nav:
  - Home: index.md
  - Concepts:
    - Overview: nav/concepts/index.md
    - Agent loop: nav/concepts/concept-agent-loop.md
    - Providers: nav/concepts/concept-providers.md
    - Tools: nav/concepts/concept-tools.md
    - "Config (dependency injection)": nav/concepts/concept-config.md
  - How-to guides:
    - Overview: nav/how-to/index.md
    - nav/how-to/install.md
    - nav/how-to/quick-start.md
    - nav/how-to/streaming.md
    - nav/how-to/permission-prompts.md
    - nav/how-to/token-usage.md
    - nav/how-to/mcp-servers.md
    - nav/how-to/skills.md
    - nav/how-to/custom-tool.md
    - AIFlow CLI:
      - nav/how-to/cli/run.md
      - nav/how-to/cli/tui.md
  - Development Guide:
    - nav/development/custom-provider.md
    - nav/development/local-provider.md
    - nav/development/json-provider.md
    - nav/development/development-guide.md
    - nav/development/release-notes.md
  - Reference:
    - nav/reference/aiflow.md
    - nav/reference/config.md
    - nav/reference/agent.md
    - nav/reference/session.md
    - "Provider ABC": nav/reference/abc-provider.md
    - "Tool ABC": nav/reference/abc-tool.md
    - Providers: nav/reference/providers.md
    - Tools: nav/reference/tools.md
    - MCP: nav/reference/mcp.md
    - Skills: nav/reference/skills.md
